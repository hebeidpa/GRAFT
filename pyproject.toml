[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graft-pillar"
version = "2.0.0"
description = "Pillar-0 imaging and clinical fusion for gastric CT outcome prediction"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.23.5",
  "pandas==2.0.3",
  "openpyxl==3.1.5",
  "PyYAML==6.0.3",
  "SimpleITK==2.5.2",
  "scikit-learn==1.3.2",
  "scipy==1.10.1",
  "matplotlib==3.7.5",
  "joblib==1.4.2",
  "transformers==4.55.2",
  "huggingface-hub==0.36.0",
  "safetensors==0.6.2",
  "timm==1.0.9",
  "einops==0.6.0",
]

[project.scripts]
graft-validate = "graft_pillar.validate_data:main"
graft-validate-clinical = "graft_pillar.validate_clinical:main"
graft-extract = "graft_pillar.extract_features:main"
graft-train = "graft_pillar.train_cv:main"
graft-predict = "graft_pillar.predict:main"
graft-evaluate = "graft_pillar.evaluate:main"
graft-fix-hf-cache = "graft_pillar.fix_hf_cache:main"

[tool.setuptools.packages.find]
where = ["src"]
