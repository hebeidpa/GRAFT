[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graft-pillar"
version = "4.0.0"
description = "Mask-guided Pillar-0 and clinical fusion for gastric cancer outcome prediction"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.23.5",
  "pandas==2.0.3",
  "openpyxl==3.1.5",
  "PyYAML==6.0.3",
  "SimpleITK==2.5.2",
  "scikit-learn==1.3.2",
  "scipy==1.10.1",
  "matplotlib==3.7.5",
  "joblib==1.4.2",
  "transformers==4.55.2",
  "huggingface-hub==0.36.0",
  "safetensors==0.6.2",
  "timm==1.0.9",
  "einops==0.6.0",
]

[project.scripts]
graft-validate = "graft_pillar.validate_data:main"
graft-fix-hf-cache = "graft_pillar.fix_hf_cache:main"
graft-train-mask-guided = "graft_pillar.train_mask_guided:main"
graft-evaluate-released = "graft_pillar.evaluate_released:main"

[tool.setuptools.packages.find]
where = ["src"]
